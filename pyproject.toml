[project]
name = "handwritten-digits"
version = "0.1.0"
description = "A neural network from scratch for handwritten digit recognition"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "streamlit>=1.28",
    "streamlit-drawable-canvas>=0.9",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
